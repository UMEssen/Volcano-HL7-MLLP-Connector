# CI for the Volcano HL7 MLLP Connector.
#
# Pipeline:
#   lint                  — hadolint on the Dockerfile.
#   test                  — sbt test (MUnit suite) + JSON conversion smoke test.
#   dependency-review     — (PRs) block dependencies with known CVEs / disallowed
#                           licenses, using the GitHub Advisory Database.
#   dependency-submission — (push to main) submit the sbt dependency graph to
#                           GitHub so Dependabot security alerts cover the JVM
#                           dependencies (sbt isn't natively parsed otherwise).
#   build                 — sbt assembly (uploads the fat JAR).
#   container             — image build, CycloneDX SBOM (Syft), Trivy scan with
#                           SARIF upload to the Security tab; pushes to GHCR.
#
# Supply-chain hardening: every THIRD-PARTY action is pinned to a full commit
# SHA (with a version comment), because tags are mutable and were the vector in
# the March 2026 aquasecurity/trivy-action compromise. First-party actions/* and
# docker/* stay on tags. Dependabot (.github/dependabot.yml) bumps both the SHAs
# and the version comments weekly.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]

# Cancel in-progress runs on the same ref except for main / tags so the
# release path always completes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

env:
  JAVA_VERSION: "25"
  JAVA_DISTRIBUTION: temurin
  SBT_OPTS: "-Xmx2g -Dfile.encoding=UTF-8"
  REGISTRY: ghcr.io
  # GHCR requires the image name to be lowercase; github.repository_owner
  # preserves the org's original casing (UMEssen), so we hardcode here.
  IMAGE_NAME: umessen/volcano-hl7-mllp

jobs:
  lint:
    name: Lint Dockerfile
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Hadolint
        uses: hadolint/hadolint-action@2332a7b74a6de0dda2e2221d575162eba76ba5e5 # v3.3.0
        with:
          dockerfile: Dockerfile
          failure-threshold: warning

  test:
    name: Test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK ${{ env.JAVA_VERSION }}
        uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Cache sbt / coursier / ivy
        uses: actions/cache@v5
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
            ~/.ivy2/cache
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt', 'project/build.properties', 'project/plugins.sbt') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Run tests (MUnit)
        run: sbt -batch test

      - name: JSON conversion smoke test
        run: sbt -batch "Test/runMain volcano.hl7mllp.JsonConversionTest"

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v6
      - name: Dependency review (GitHub Advisory DB)
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure

  dependency-submission:
    name: Submit dependency graph
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write   # the Dependency Submission API writes a snapshot
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}
      - uses: sbt/setup-sbt@v1
      - name: Submit sbt dependency graph
        uses: scalacenter/sbt-dependency-submission@64084844d2b0a9b6c3765f33acde2fbe3f5ae7d3 # v3.1.0

  build:
    name: Build fat JAR
    needs: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-java@v5
        with:
          distribution: ${{ env.JAVA_DISTRIBUTION }}
          java-version: ${{ env.JAVA_VERSION }}

      - uses: sbt/setup-sbt@v1

      - name: Cache sbt / coursier / ivy
        uses: actions/cache@v5
        with:
          path: |
            ~/.sbt
            ~/.cache/coursier
            ~/.ivy2/cache
          key: ${{ runner.os }}-sbt-${{ hashFiles('**/*.sbt', 'project/build.properties', 'project/plugins.sbt') }}
          restore-keys: |
            ${{ runner.os }}-sbt-

      - name: Assemble fat JAR
        run: sbt -batch assembly

      - name: Locate JAR
        id: jar
        run: |
          jar=$(ls target/scala-*/volcano-connector-hl7-mllp-assembly-*.jar | head -n1)
          echo "path=$jar" >> "$GITHUB_OUTPUT"
          echo "Built: $jar ($(du -h "$jar" | cut -f1))"

      - name: Upload JAR artifact
        uses: actions/upload-artifact@v7
        with:
          name: volcano-connector-hl7-mllp-jar
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error
          retention-days: 14

  container:
    name: Container image
    needs: test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      security-events: write   # upload the Trivy SARIF to the Security tab
      id-token: write          # for cosign / OIDC if added later
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Compute image metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tags: branch + PR + semver from git tags + sha.
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,format=short
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}
          labels: |
            org.opencontainers.image.title=Volcano HL7 MLLP Connector
            org.opencontainers.image.description=HL7 v2 over MLLP -> Kafka bridge
            org.opencontainers.image.vendor=UMEssen

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Build once, load into the local docker daemon for SBOM + scan.
      - name: Build (load only)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: scan-target:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # CycloneDX SBOM of the final image (OS packages + JVM libraries).
      - name: Generate SBOM (Syft, CycloneDX)
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          image: scan-target:ci
          format: cyclonedx-json
          output-file: sbom.cdx.json
          artifact-name: volcano-hl7-mllp-sbom.cdx.json

      # Scan → SARIF (always uploaded so findings land in the Security tab even
      # when the gate below fails).
      - name: Trivy scan (SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan-target:ci
          format: sarif
          output: trivy-results.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library

      - name: Upload Trivy SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy-image

      # Gate: fail the job (and block the push below) on unfixed-excluded HIGH/CRITICAL.
      - name: Trivy gate
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: scan-target:ci
          format: table
          exit-code: "1"
          ignore-unfixed: true
          severity: CRITICAL,HIGH
          vuln-type: os,library

      # Build + push the real tags only when the scan above passed.
      - name: Build + push (real tags)
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
