version: 2
updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    groups:
      docker-actions:
        patterns:
          - "docker/*"
      java-actions:
        patterns:
          - "actions/setup-java"
          - "sbt/setup-sbt"

  - package-ecosystem: docker
    directory: "/"
    schedule:
      interval: weekly
